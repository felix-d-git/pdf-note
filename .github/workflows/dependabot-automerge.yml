# Standard A: Dependabot-PRs (patch/minor) nach grüner CI automatisch squash-mergen.
# Majors bleiben offen (stehen im Commit-Text als semver-major).
name: Dependabot automerge
on:
  workflow_run:
    workflows: ["windows"]
    types: [completed]
permissions:
  contents: write
  pull-requests: write
jobs:
  merge:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.actor.login == 'dependabot[bot]' && startsWith(github.event.workflow_run.head_branch, 'dependabot/')
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          pr=$(gh pr list --head "$BRANCH" --json number -q '.[0].number')
          [ -n "$pr" ] || exit 0
          if gh pr view "$pr" --json commits -q '.commits[].messageBody' | grep -q semver-major; then
            echo "Major-Update -> bleibt offen"; exit 0
          fi
          gh pr merge "$pr" --squash --delete-branch --match-head-commit "$SHA"
