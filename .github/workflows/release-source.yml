# AGPL-3.0 §6 (Issue #8): jedes Release verweist auf seinen Quellstand und trägt SOURCE.md + die MuPDF-C-Quellen
# (mupdf-sys-Crate) als Asset. Bricht ab, wenn Tag und App-Version abweichen (#24). Kein Auto-Release: Releases nur
# manuell nach Versionssprung in package.json + src-tauri/Cargo.toml (standard-a-exclude: no-release).
name: Release-Quellcode
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release-Tag, z. B. v1.2.1
        required: true
permissions:
  contents: write
jobs:
  source:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}
      - env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/release-source.sh "$TAG"
