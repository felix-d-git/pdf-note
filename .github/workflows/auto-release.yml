# Standard A: seit dem letzten Release nur Dependabot-Commits -> Patch-Release (der Pi zieht es nachts).
# Sobald auch eigene Commits dabei sind, wird nicht automatisch released.
name: Auto-Release
on:
  schedule: [{cron: "30 0 * * *"}]
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(gh release view --json tagName -q .tagName) || { echo "noch kein Release"; exit 0; }
          authors=$(git log "$last"..HEAD --format=%an | sort -u)
          [ -n "$authors" ] || { echo "nichts Neues seit $last"; exit 0; }
          [ "$authors" = "dependabot[bot]" ] || { echo "eigene Commits seit $last -> manuelles Release"; exit 0; }
          IFS=. read -r ma mi pa <<< "${last#v}"
          next="v$ma.$mi.$((${pa%%[!0-9]*}+1))"
          gh release create "$next" --target "$GITHUB_SHA" --generate-notes --title "$next" \
            --notes "Quellcode (AGPL-3.0 §6): https://github.com/$GITHUB_REPOSITORY/tree/$next"
          # SOURCE.md + MuPDF-C-Quellen als Assets (Releases per GITHUB_TOKEN lösen "release" nicht selbst aus)
          gh workflow run release-source.yml -f tag="$next"
