# Windows-Build + Checks. Kein Release-Upload, keine Secrets.
# npm run test:data fehlt bewusst: testdata/pdfs/ ist gitignored.
name: windows

on:
  push:
    branches: [second, master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      # .cargo/config.toml zeigt auf den lokalen Temp-Pfad; LIBCLANG_PATH passt (LLVM ist im Runner-Image)
      CARGO_TARGET_DIR: ${{ github.workspace }}\target
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> ../target
      - run: npm ci
      - run: npm run check
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      # erzeugt in beforeBuildCommand die Lizenzsammlung THIRD-PARTY-LICENSES/ (scripts/licenses.mjs)
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about
      - run: npm run tauri build
      # Issue #7: jede Datei der Lizenzsammlung muss im Installer liegen (<Installationsordner>\licenses)
      - name: Lizenztexte im Installer
        shell: bash
        run: |
          exe=$(ls target/release/bundle/nsis/*-setup.exe)
          7z l "$exe" | tr '\\' / > installer.txt
          miss=0
          for f in THIRD-PARTY-LICENSES/*; do
            grep -qF "licenses/${f##*/}" installer.txt || { echo "fehlt im Installer: ${f##*/}"; miss=1; }
          done
          [ "$miss" = 0 ] || { cat installer.txt; exit 1; }
          echo "$(ls THIRD-PARTY-LICENSES | wc -l) Lizenzdateien im Installer"
