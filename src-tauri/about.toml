# cargo-about (Issue #7): Lizenztexte aller ausgelieferten Rust-Crates für den Installer, erzeugt von scripts/licenses.mjs.
# Nur Ziel Windows/MSVC, ohne Build-/Dev-Abhängigkeiten. Eine Lizenz außerhalb dieser Liste lässt den Build scheitern
# (Schranke gegen inkompatible Lizenzen nach Dependabot-Updates) – dann erst prüfen, dann ergänzen.
accepted = [
    "AGPL-3.0-only",
    "AGPL-3.0", # veraltete SPDX-Kennung, so in mupdf/mupdf-sys 0.8.0
    "MPL-2.0",
    "Apache-2.0",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "CC0-1.0",
    "MIT-0",
    "Unicode-3.0",
    "Unlicense",
]
targets = ["x86_64-pc-windows-msvc"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
