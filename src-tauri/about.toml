# cargo-about (Issue #7): Lizenztexte aller ausgelieferten Rust-Crates für den Installer, erzeugt von scripts/licenses.mjs.
# Nur Ziel Windows/MSVC, ohne Build-/Dev-Abhängigkeiten. Eine Lizenz außerhalb dieser Liste lässt den Build scheitern
# (Schranke gegen inkompatible Lizenzen nach Dependabot-Updates) – dann erst prüfen, dann ergänzen.
accepted = [
    "AGPL-3.0-only",
    "AGPL-3.0", # veraltete SPDX-Kennung, so in mupdf/mupdf-sys 0.8.0; deren C-Code (MuPDF, jbig2dec) ist AGPL-3.0-or-later (#25)
    "MPL-2.0",
    "Apache-2.0",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "CC0-1.0",
    "MIT-0",
    "Unicode-3.0",
    "Unlicense",
]
targets = ["x86_64-pc-windows-msvc"]
ignore-build-dependencies = true
ignore-dev-dependencies = true

# RY1–RY5 (#20): Crates ohne erkannte Lizenzdatei bekämen nur den SPDX-Mustertext ohne Rechteinhaber.
# Prüfsumme = SHA-256 der Datei; ändert sie sich nach einem Update, bricht cargo-about ab → Text neu prüfen.
[brotli-decompressor.clarify]
license = "BSD-3-Clause" # Feld "BSD-3-Clause/MIT" = wahlweise; nur der BSD-Text (Dropbox) liegt bei
[[brotli-decompressor.clarify.files]]
path = "LICENSE"
license = "BSD-3-Clause"
checksum = "c0c56f26d9c051cac4d200c34c84e7ae9aaa853e01a982a1df08b09931e518ae"

[dpi.clarify]
license = "Apache-2.0 AND MIT"
[[dpi.clarify.files]]
path = "LICENSE"
license = "Apache-2.0"
checksum = "6dc0e068dcf3a5bc8e054205b85b7720e1d49265bbc64bf515d2cf79197df69a"
[[dpi.clarify.files]]
path = "LICENSE-LIBM-MIT"
license = "MIT"
checksum = "9eff396a99bafd208e7126602420d6864f6066c08b84485a5b032320a9c01997"

# Ohne Lizenzdatei im Crate: Text aus dem Quell-Repo zum Commit in .cargo_vcs_info.json (cargo-about lädt ihn beim Erzeugen)
[alloc-stdlib.clarify]
license = "BSD-3-Clause"
[[alloc-stdlib.clarify.git]]
